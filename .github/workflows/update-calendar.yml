# Diese Datei kommt im Repo an den Pfad:  .github/workflows/update-calendar.yml
name: Update St. Pauli Ticket-Kalender

on:
  schedule:
    - cron: '12 6 * * 1,3'   # Mo & Mi, 06:12 UTC (~08:12 Uhr DE-Sommerzeit)
  workflow_dispatch: {}       # manuell ausloesbar (fuer den ersten Testlauf)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Abhaengigkeiten installieren
        run: pip install requests markdownify icalendar beautifulsoup4 tzdata
      - name: Kalender bauen
        run: python build_ics_cloud.py
      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add st_pauli_tickets.ics
          if git diff --staged --quiet; then
            echo "Keine Aenderungen."
          else
            git commit -m "Kalender aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
